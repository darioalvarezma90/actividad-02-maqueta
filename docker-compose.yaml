services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: inclutech-maqueta:local
    environment:
      PORT: "8080"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
