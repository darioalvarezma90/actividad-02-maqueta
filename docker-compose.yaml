services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: inclutech-maqueta:local
    environment:
      APP_PORT: "${APP_PORT:-8000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:${APP_PORT:-8000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
